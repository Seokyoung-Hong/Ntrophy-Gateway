<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Gateway Auto Test</title>
</head>
<body>
<h1>Gateway 자동 기능 점검</h1>
<a href="/test">수동 조작 콘솔 /test</a>

<p>
Base URL <input id="base" size="40"><br>
Live Base(비우면 같은 origin) <input id="lbase" size="40"><br>
Admin Key <input id="akey" size="30" type="password">
</p>
<p>
<label><input type="checkbox" id="o_attack" checked> 공격 시나리오 포함(15)</label>
<label><input type="checkbox" id="o_or"> OpenRouter 항목(17~18)</label>
<label><input type="checkbox" id="o_vllm"> vLLM 공급자(옵션, 기본 끔)(19, DB를 vLLM 시드로 초기화)</label>
</p>
<button id="runall" onclick="runAll()">전체 실행</button>
<span id="prog"></span>

<table border="1" cellpadding="3">
<thead><tr><th>#</th><th>항목</th><th>기대</th><th>실제</th><th>결과</th><th>ms</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p id="sum"></p>
<pre id="json"></pre>

<script>
var el = function (i) { return document.getElementById(i); };
var v = function (i) { return el(i).value; };
var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
var LS = "gwtest"; // /test와 같은 키 공유
var C = {};        // 이전 항목 결과 변수(tokens, honeykeys, ...)
var res = {};      // n -> {st, actual, ms}
var busy = false;

function skip(m) { var e = new Error(m); e.skip = true; throw e; }
function fail(m) { throw new Error(m); }
function ok(c, m) { if (!c) fail(m); }

(function () {
  var ls = {};
  try { ls = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
  el("base").value = ls.base || location.origin;
  el("lbase").value = ls.lbase || "";
  el("akey").value = ls.akey || "";
})();
function saveCfg() {
  var ls = {};
  try { ls = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
  ls.base = v("base"); ls.akey = v("akey"); ls.lbase = v("lbase");
  try { localStorage.setItem(LS, JSON.stringify(ls)); } catch (e) {}
}

// 실패해도 {status, json, text} 반환(예외 없음)
async function raw(url, method, body, headers) {
  var opt = { method: method || "GET", headers: headers || {} };
  if (body !== undefined && body !== null) {
    opt.body = JSON.stringify(body);
    opt.headers["Content-Type"] = "application/json";
  }
  try {
    var r = await fetch(url, opt);
    var t = await r.text(), j = null;
    try { j = JSON.parse(t); } catch (e) {}
    return { status: r.status, json: j, text: t };
  } catch (e) {
    return { status: 0, json: null, text: "NETWORK ERROR: " + e };
  }
}
function base() { return v("base").replace(/\/$/, ""); }
function lbase() { return (v("lbase") || location.origin).replace(/\/$/, ""); }
function api(path, method, body, noKey) {
  var h = {};
  if (!noKey && v("akey")) h["X-Admin-Key"] = v("akey");
  return raw(base() + path, method, body, h);
}
// 사용자 호출. ip가 있으면 X-Demo-Source-IP(+관리자 키)로 출발 IP 흉내
function chat(token, ip) {
  var h = { Authorization: "Bearer " + token };
  if (ip) { h["X-Demo-Source-IP"] = ip; if (v("akey")) h["X-Admin-Key"] = v("akey"); }
  return raw(base() + "/v1/chat/completions", "POST",
    { model: "mock", messages: [{ role: "user", content: "hi" }], max_tokens: 50 }, h);
}
function brief(r) { return "HTTP " + r.status + " " + (r.text || "").slice(0, 120); }
function expect(r, code, errName, label) {
  if (r.status !== code) fail(label + ": HTTP " + r.status + " (기대 " + code + ") " + (r.text || "").slice(0, 120));
  if (errName && !(r.json && r.json.error === errName)) fail(label + ": error=" + (r.json && r.json.error) + " (기대 " + errName + ")");
}
async function ensure() { if (!C.tokens) await items[3].fn(); }
function wifPath(r) { if (r.status === 404) skip("미지원(404)"); }

var items = [
{ n: 1, name: "연결", expect: "GET /test 200", fn: async function () {
  var r = await raw(base() + "/test"); expect(r, 200, null, "/test"); return "200"; } },
{ n: 2, name: "관리자 보호", expect: "키 없이 /admin/dashboard 401", fn: async function () {
  var r = await api("/admin/dashboard", "GET", null, true); expect(r, 401, null, "no key"); return "401"; } },
{ n: 3, name: "관리자 키 인증", expect: "/admin/dashboard 200, status 필드", fn: async function () {
  var r = await api("/admin/dashboard"); expect(r, 200, null, "dashboard");
  ok(r.json && r.json.status, "status 필드 없음"); return "200 status=" + r.json.status; } },
{ n: 4, name: "/demo/reset", expect: "200, tokens(userA,userB), honeykeys", fn: async function () {
  var r = await api("/demo/reset", "POST"); expect(r, 200, null, "reset");
  var t = r.json && r.json.tokens;
  ok(t && t["userA"] && t["userB"], "tokens userA/userB 없음");
  ok(r.json.honeykeys && Object.keys(r.json.honeykeys).length, "honeykeys 없음");
  C.tokens = t; C.honeykeys = r.json.honeykeys; return "200 tokens 2, honeykeys " + Object.keys(r.json.honeykeys).length; } },
{ n: 5, name: "사용자 호출", expect: "/v1/chat/completions 200 (CIDR 0개면 모두 허용)", fn: async function () {
  await ensure();
  var r = await chat(C.tokens["userA"]), how = "헤더 없이";
  if (r.status === 403) { r = await chat(C.tokens["userA"], "10.0.0.5"); how = "X-Demo-Source-IP 재시도"; }
  expect(r, 200, null, "chat"); ok(r.json && r.json.usage, "usage 없음"); return "200 (" + how + ")"; } },
{ n: 6, name: "IP 정책", expect: "0개면 모두 허용, 10.0.0.0/16 등록 시 203.0.113.9 403·10.0.0.5 200, * 허용, 삭제 후 모두 허용", fn: async function () {
  await ensure(); var tk = C.tokens["userA"], out = [];
  var l = await api("/admin/cidrs"); expect(l, 200, null, "list");
  if (l.json.length === 0) { expect(await chat(tk, "203.0.113.9"), 200, null, "0개일 때 임의 IP"); out.push("0개 200"); }
  var a = await api("/admin/cidrs", "POST", { cidr: "10.0.0.0/16", label: "INTERNAL" }); expect(a, 200, null, "add 10.0.0.0/16");
  try {
    expect(await chat(tk, "203.0.113.9"), 403, "ip_not_allowed", "허용 밖 IP");
    expect(await chat(tk, "10.0.0.5"), 200, null, "허용 IP");
  } finally { await api("/admin/cidrs/" + a.json.id, "DELETE"); }
  out.push("등록 시 403/200");
  var s = await api("/admin/cidrs", "POST", { cidr: "*", label: "ALL" }); expect(s, 200, null, "add *");
  try { expect(await chat(tk, "203.0.113.9"), 200, null, "* 등록 시"); } finally { await api("/admin/cidrs/" + s.json.id, "DELETE"); }
  out.push("* 200");
  if (l.json.length === 0) { expect(await chat(tk, "203.0.113.9"), 200, null, "삭제 후"); out.push("삭제 후 200"); }
  return out.join(", "); } },
{ n: 7, name: "잘못된 토큰", expect: "401 invalid_token", fn: async function () {
  var r = await chat("nvm-wrong-token", "10.0.0.5"); expect(r, 401, "invalid_token", "token"); return "401 invalid_token"; } },
{ n: 8, name: "허니키", expect: "401 + HONEYKEY 사고 생성", fn: async function () {
  await ensure(); var hk = Object.values(C.honeykeys)[0];
  var r = await chat(hk, "10.0.0.99"); expect(r, 401, "invalid_token", "honeykey");
  await sleep(500);
  var inc = await api("/admin/incidents"); expect(inc, 200, null, "incidents");
  ok(Array.isArray(inc.json) && inc.json.some(function (x) { return x.trigger_type === "HONEYKEY"; }), "HONEYKEY 사고 없음");
  await items[3].fn(); // 허니키는 전체 토큰 폐기·서비스 정지 → 다음 항목을 위해 리셋(새 토큰)
  return "401, HONEYKEY 사고 있음 (이후 리셋)"; } },
{ n: 9, name: "설정", expect: "조회 + unauthorized_call_limit 변경/복원", fn: async function () {
  var g = await api("/admin/settings"); expect(g, 200, null, "get");
  var old = g.json.unauthorized_call_limit; ok(typeof old === "number", "unauthorized_call_limit 없음");
  var p = await api("/admin/settings", "PUT", { unauthorized_call_limit: old + 7 }); expect(p, 200, null, "put");
  var ch = p.json.unauthorized_call_limit;
  var b = await api("/admin/settings", "PUT", { unauthorized_call_limit: old }); expect(b, 200, null, "restore");
  ok(ch === old + 7, "변경 반영 안 됨: " + ch); ok(b.json.unauthorized_call_limit === old, "복원 실패");
  return old + " -> " + ch + " -> " + old; } },
{ n: 10, name: "허용 CIDR", expect: "목록 조회, 임시 CIDR 추가/삭제", fn: async function () {
  var l = await api("/admin/cidrs"); expect(l, 200, null, "list"); ok(Array.isArray(l.json), "목록 형식 아님");
  var a = await api("/admin/cidrs", "POST", { cidr: "198.51.100.0/24", label: "auto-test" }); expect(a, 200, null, "add");
  var l2 = await api("/admin/cidrs");
  ok(l2.json.some(function (x) { return x.id === a.json.id; }), "추가한 CIDR이 목록에 없음");
  var d = await api("/admin/cidrs/" + a.json.id, "DELETE"); expect(d, 200, null, "delete");
  var l3 = await api("/admin/cidrs");
  ok(!l3.json.some(function (x) { return x.id === a.json.id; }), "삭제 안 됨");
  return "목록 " + l.json.length + "개, 추가/삭제 OK"; } },
{ n: 11, name: "서비스 정지/재개", expect: "403 service_suspended -> 200", fn: async function () {
  await ensure();
  var s = await api("/admin/services"); expect(s, 200, null, "services");
  var svc = s.json.filter(function (x) { return x.name === "userA"; })[0]; ok(svc, "userA 서비스 없음");
  var msg = "";
  try {
    var sp = await api("/admin/services/" + svc.id + "/suspend", "POST"); expect(sp, 200, null, "suspend");
    var r = await chat(C.tokens["userA"], "10.0.0.5"); expect(r, 403, "service_suspended", "정지 중 호출");
  } finally {
    var rs = await api("/admin/services/" + svc.id + "/resume", "POST"); msg = rs.status;
  }
  ok(msg === 200, "resume HTTP " + msg);
  var r2 = await chat(C.tokens["userA"], "10.0.0.5"); expect(r2, 200, null, "재개 후 호출");
  return "403 service_suspended -> resume -> 200"; } },
{ n: 12, name: "WIF(OIDC)", expect: "seed->token->호출 200, 변조 401 wif_invalid_signature", fn: async function () {
  await ensure();
  var s = await api("/demo/wif/seed", "POST"); wifPath(s); expect(s, 200, null, "seed");
  var t = await api("/demo/wif/token", "POST", {}); wifPath(t); expect(t, 200, null, "token");
  var jwt = t.json.token, r = await chat(jwt, "10.0.0.5"); expect(r, 200, null, "JWT 호출");
  var p = jwt.split("."); p[2] = (p[2][0] === "A" ? "B" : "A") + p[2].slice(1);
  var r2 = await chat(p.join("."), "10.0.0.5"); expect(r2, 401, "wif_invalid_signature", "변조");
  return "JWT 200, 변조 401 wif_invalid_signature"; } },
{ n: 13, name: "사용량", expect: "summary에 userA, forecast 200, 예산 설정/해제", fn: async function () {
  await ensure(); await chat(C.tokens["userA"], "10.0.0.5");
  var s = await api("/admin/usage/summary?range=day"); expect(s, 200, null, "summary");
  var a = (s.json.services || []).filter(function (x) { return x.name === "userA"; })[0];
  ok(a && a.calls >= 1, "summary에 userA 호출 없음");
  var f = await api("/admin/usage/forecast"); expect(f, 200, null, "forecast"); ok(f.json.projected, "projected 없음");
  var b = await api("/admin/usage/budget", "PUT", { monthly_budget_krw: 1000000 }); expect(b, 200, null, "budget set");
  var g = await api("/admin/usage/budget"); ok(g.json.monthly_budget_krw === 1000000, "예산 반영 안 됨");
  var u = await api("/admin/usage/budget", "PUT", { monthly_budget_krw: null }); expect(u, 200, null, "budget clear");
  var g2 = await api("/admin/usage/budget"); ok(g2.json.monthly_budget_krw === null, "예산 해제 안 됨");
  return "userA calls=" + a.calls + ", forecast 200, 예산 설정/해제"; } },
{ n: 14, name: "청중 라이브", expect: "/live/config, /live/stats, /live/chat 200", fn: async function () {
  var L = lbase();
  var c = await raw(L + "/live/config"); expect(c, 200, null, "config"); ok(c.json && c.json.key, "key 없음");
  var s = await raw(L + "/live/stats"); expect(s, 200, null, "stats");
  var r = await raw(L + "/live/chat", "POST", { key: c.json.key, message: "hi" }); expect(r, 200, null, "chat");
  return "config/stats/chat 200"; } },
{ n: 15, name: "공격 시나리오", expect: "SUSPECT->WARNING->BLOCKED->RECOVERED, 손실<한도, 차단 후 사용자 200", opt: "o_attack", fn: async function () {
  await ensure();
  var c = await raw(lbase() + "/live/config"); ok(c.status === 200 && c.json.key, "live key 없음");
  var st = await api("/demo/attack/start", "POST"); expect(st, 200, null, "attack start");
  var seen = [], d, t0 = Date.now(), done = false;
  try {
    while ((Date.now() - t0) < 60000) {
      d = await api("/admin/dashboard");
      if (d.json && d.json.status && seen[seen.length - 1] !== d.json.status) seen.push(d.json.status);
      var sec = Math.round((Date.now() - t0) / 1000);
      el("prog").textContent = "공격 폴링 " + sec + "s: " + seen.join(">");
      if (seen.indexOf("RECOVERED") >= 0) { done = true; break; }
      await sleep(1000);
    }
  } finally { /* stop은 마지막에 */ }
  var seq = seen.join(">");
  try {
    ok(done, "60초 내 RECOVERED 미도달: " + seq);
    ok(seen.indexOf("BLOCKED") >= 0, "BLOCKED 미관찰: " + seq);
    await sleep(3500); // 최종 손실 재계산(폐기 2.5초 후)
    var il = await api("/admin/incidents"); ok(Array.isArray(il.json) && il.json.length, "사고 없음");
    var inc = il.json.filter(function (x) { return x.trigger_type !== "HONEYKEY"; })[0]; ok(inc, "공격 사고 없음");
    var det = await api("/admin/incidents/" + inc.id); expect(det, 200, null, "incident");
    ok(det.json.loss_calls < det.json.limit_calls, "손실 " + det.json.loss_calls + " >= 한도 " + det.json.limit_calls);
    var lc = await raw(lbase() + "/live/chat", "POST", { key: c.json.key, message: "hi" });
    expect(lc, 401, "revoked", "live 차단");
    var r = await chat(C.tokens["userA"], "10.0.0.5"); expect(r, 200, null, "차단 후 사용자 호출");
    var miss = ["SUSPECT", "WARNING"].filter(function (x) { return seen.indexOf(x) < 0; });
    return seq + (miss.length ? " (폴링에서 못 본 상태: " + miss.join(",") + ")" : "") + "; 손실 " + det.json.loss_calls + " < 한도 " + det.json.limit_calls + "; live 401; 사용자 200";
  } finally {
    await api("/demo/attack/stop", "POST");
  } } },
{ n: 16, name: "리셋 후 정리", expect: "/demo/reset 후 status NORMAL", fn: async function () {
  var r = await api("/demo/reset", "POST"); expect(r, 200, null, "reset");
  C.tokens = r.json.tokens; C.honeykeys = r.json.honeykeys;
  var d = await api("/admin/dashboard"); expect(d, 200, null, "dashboard");
  ok(d.json.status === "NORMAL", "status=" + d.json.status); return "NORMAL"; } },
{ n: 17, name: "OpenRouter provision", expect: "응답 코드 표시(SKIP 허용)", opt: "o_or", fn: async function () {
  var r = await api("/admin/openrouter/provision", "POST", { role: "STANDBY", limit_usd: 0.01 });
  if (r.status === 200) return "200 " + brief(r).slice(0, 80);
  skip("HTTP " + r.status + " " + (r.text || "").slice(0, 80)); } },
{ n: 18, name: "OpenRouter cleanup", expect: "응답 코드 표시(SKIP 허용)", opt: "o_or", fn: async function () {
  var r = await api("/demo/cleanup-openrouter", "POST");
  if (r.status === 200) return "200 " + r.text.slice(0, 80);
  skip("HTTP " + r.status + " " + (r.text || "").slice(0, 80)); } },
{ n: 19, name: "vLLM 공급자 연결", expect: "응답 코드 표시(404·실패는 SKIP)", opt: "o_vllm", fn: async function () {
  var r = await api("/demo/reset-vllm", "POST");
  if (r.status === 200) return "200 leaked_key=" + String(r.json && r.json.leaked_key || "").slice(0, 16) + "...";
  skip("HTTP " + r.status + " " + (r.text || "").slice(0, 80)); } }
];

function render() {
  var h = "", c = { PASS: 0, FAIL: 0, SKIP: 0 };
  items.forEach(function (it) {
    var x = res[it.n] || {};
    if (x.st) c[x.st]++;
    h += "<tr><td>" + it.n + "</td><td>" + esc(it.name) + "</td><td>" + esc(it.expect) + "</td><td>" + esc(x.actual) +
      "</td><td><b>" + (x.st || "") + "</b></td><td>" + (x.ms == null ? "" : x.ms) +
      "</td><td><button onclick=\"runOne(" + it.n + ")\">개별 실행</button></td></tr>";
  });
  el("rows").innerHTML = h;
  el("sum").textContent = "PASS " + c.PASS + " / FAIL " + c.FAIL + " / SKIP " + c.SKIP;
  el("json").textContent = JSON.stringify(items.map(function (it) {
    var x = res[it.n] || {}; return { n: it.n, name: it.name, expect: it.expect, actual: x.actual, result: x.st, ms: x.ms };
  }), null, 1);
}
async function exec(it) {
  var t = Date.now(), x = {};
  res[it.n] = { st: "RUN", actual: "실행 중..." }; render();
  try { x.actual = await it.fn(); x.st = "PASS"; }
  catch (e) { x.actual = (e && e.message) || String(e); x.st = e && e.skip ? "SKIP" : "FAIL"; }
  x.ms = Date.now() - t; res[it.n] = x; render();
}
async function runOne(n) {
  if (busy) return; busy = true; saveCfg();
  await exec(items[n - 1]); el("prog").textContent = "완료"; busy = false;
}
async function runAll() {
  if (busy) return; busy = true; saveCfg(); res = {}; C = {}; render();
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    el("prog").textContent = "진행 " + (i + 1) + "/" + items.length + " : " + it.name;
    if (it.opt && !el(it.opt).checked) { res[it.n] = { st: "SKIP", actual: "옵션 꺼짐", ms: 0 }; render(); continue; }
    await exec(it);
  }
  el("prog").textContent = "완료"; busy = false;
}
render();
</script>
</body>
</html>
