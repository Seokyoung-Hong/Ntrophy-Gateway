<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유출된 키 체험</title>
<style>
  /* 디자이너용 훅: .live-* 클래스, body[data-state=active|busy|revoked|limited] */
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 560px; margin-inline: auto; }
  .live-field, .live-input, .live-send { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; margin: 4px 0 12px; }
  .live-key-input { font-family: monospace; }
  .live-reply { white-space: pre-wrap; min-height: 4em; border: 1px solid #ccc; padding: 10px; }
  .live-revoked { font-size: 2em; font-weight: bold; color: #c00; text-align: center; margin: 16px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="live" data-state="active">
  <h1 class="live-title">유출된 API 키로 AI 써보기</h1>
  <label class="live-key-label">유출된 키:
    <input id="key" class="live-field live-key-input" autocomplete="off">
  </label>
  <form id="form" class="live-form">
    <textarea id="msg" class="live-input live-message" rows="3" maxlength="300" placeholder="아무 말이나 보내보세요 (최대 300자)"></textarea>
    <button id="send" class="live-send" type="submit">전송</button>
  </form>
  <div id="revoked" class="live-revoked" hidden>🚫 차단되었습니다</div>
  <div id="reply" class="live-reply"></div>
  <p id="status" class="live-status">불러오는 중…</p>
<script>
const $ = id => document.getElementById(id);
const setStatus = (t, state) => { $("status").textContent = t; if (state) document.body.dataset.state = state; };
const loadConfig = () => fetch("/live/config").then(r => r.json()).then(c => { $("key").value = c.key; setStatus("준비됨 · 모델 " + c.model, "active"); });
loadConfig();
let locked = false;  // 차단되면 리셋(key_status가 active로 복귀)으로만 풀린다
const setLocked = on => {
  locked = on; $("revoked").hidden = !on; $("key").disabled = $("msg").disabled = $("send").disabled = on;
  if (on) setStatus("게이트웨이가 유출을 탐지해 키를 폐기했습니다.", "revoked"); else loadConfig();
};
setInterval(() => fetch("/live/stats").then(r => r.json()).then(s => {
  if (s.key_status === "revoked" && !locked) setLocked(true);
  else if (s.key_status === "active" && locked) setLocked(false);
}).catch(() => {}), 3000);
$("form").onsubmit = async e => {
  e.preventDefault();
  if (locked) return;
  const message = $("msg").value.trim();
  if (!message) return;
  $("send").disabled = true; setStatus("응답 기다리는 중…", "busy");
  try {
    const r = await fetch("/live/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: $("key").value.trim(), message }) });
    if (r.status === 401) { setLocked(true); return; }
    if (r.status === 429) { setStatus("잠시 후 다시 시도하세요.", "limited"); }
    else if (!r.ok) { setStatus("오류 (" + r.status + ")", "active"); }
    else { $("reply").textContent = (await r.json()).reply; $("msg").value = ""; setStatus("성공 (200)", "active"); }
  } catch { setStatus("네트워크 오류. 잠시 후 다시 시도하세요.", "active"); }
  $("send").disabled = locked;
};
</script>
</body>
</html>
